server.port=8085

#DB Connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;database=TWShop;trustServerCertificate=true;
spring.datasource.username=bianca
spring.datasource.password=password

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

## Thymeleaf
spring.thymeleaf.template-loader-path= classpath:/templates
spring.thymeleaf.suffix= .html
spring.thymeleaf.cache= false

spring.messages.basename=validation

# App Properties
OnlineShop.app.jwtSecret= shopSecretKey
OnlineShop.app.jwtExpirationMs= 86400000