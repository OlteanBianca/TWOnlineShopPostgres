<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:include="fragments/components::header"></div>
    <title></title>
</head>

<body>

<div class="container mt-5">
    <div class="shadow p-3 mb-5 bg-body rounded">
        <form method="POST" class="form-signin" th:object="${userForm}" th:action="@{/register}">

            <h2 class="form-heading text-center">Create your account</h2>

            <div class="form-group">
                <!-- Username -->
                <div class="form-floating mb-3">
                    <input id="usernameInput"
                           name="username"
                           type="text"
                           class="form-control"
                           placeholder="Username"
                           th:field="*{username}"
                           autofocus="autofocus">
                    <label for="usernameInput">Username</label>
                    <span class="has-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>

                <!-- Email -->
                <div class="form-floating mb-3">
                    <input id="emailInput"
                           name="email"
                           type="text"
                           class="form-control"
                           placeholder="Username"
                           th:field="*{email}"
                           autofocus="autofocus">
                    <label for="emailInput">Email</label>
                    <span class="has-error w3-text-red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <!-- Password -->
                <div class="form-floating mb-3">
                    <input id="passwordInput"
                           name="password"
                           type="password"
                           class="form-control"
                           th:field="*{password}"
                           placeholder="Password">
                    <label for="passwordInput">Password</label>
                    <span class="has-error w3-text-red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>

                <!--Password Confirm -->
                <div class="form-floating mb-3">
                    <input id="confirmPassword"
                           name="confirmPassword"
                           type="password"
                           class="form-control"
                           th:field="*{passwordConfirm}"
                           placeholder="Password">
                    <label for="confirmPassword">Password</label>
                    <span class="has-error w3-text-red" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></span>
                </div>

                <!-- ShopName -->
                <div id="shopName" class="form-floating mb-3" hidden="hidden">
                    <input id="ShopNameInput"
                           name="ShopName"
                           type="text"
                           class="form-control"
                           placeholder="ShopName"
                           th:field="*{shopName}"
                           autofocus="autofocus">
                    <label for="ShopNameInput">Shop Name</label>
                    <span class="has-error w3-text-red" th:if="${#fields.hasErrors('shopName')}" th:errors="*{shopName}"></span>
                </div>

                <!-- Address -->
                <div id="address" class="form-floating mb-3" hidden="hidden">
                    <input id="addressInput"
                           name="address"
                           type="text"
                           class="form-control"
                           placeholder="Address"
                           th:field="*{address}"
                           autofocus="autofocus">
                    <label for="addressInput">Address</label>
                    <span class="has-error w3-text-red" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                </div>

                <!-- Code -->
                <div id="code" class="form-floating mb-3" hidden = hidden >
                    <input id="codeInput"
                           name="code"
                           type="text"
                           class="form-control"
                           placeholder="Code"
                           th:field="*{code}"
                           autofocus="autofocus">
                    <label for="codeInput">Code</label>
                    <span class="has-error w3-text-red" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span>
                </div>

                <!--role-->
                <label for="role">Select a role:</label>
                <div class="form-floating mb-3">
                    <select name="role" id="role" th:field="*{roleName}" onchange="change()">
                        <option value="client" >Client</option>
                        <option value="admin" >Admin</option>
                        <option value="admin_bb">Admin BB</option>
                        <option value="admin_bc">Admin BC</option>
                    </select>
                </div>

            </div>

            <!-- Login/Register -->
            <div class="text-center text-lg-start mt-4 pt-2">
                <button class="btn btn-primary btn-lg" style="padding-left: 2.5rem; padding-right: 2.5rem;" type="submit"> Submit </button>

                <p class="small fw-bold mt-2 pt-1 mb-0">
                    <a href="/login" class="link-danger">Login</a>
                </p>
            </div>

        </form>
    </div>
</div>

<div th:include="fragments/components::bootstrap_script"></div>

<script>

    function change() {

        const e = document.getElementById("role");
        const value = e.value;

        if(value === "admin_bb" || value === "admin_bc") {
            document.getElementById("code").hidden = false;
            document.getElementById("address").hidden = false;
            document.getElementById("shopName").hidden = false;
        } else{
            document.getElementById("code").hidden = true;
            document.getElementById("address").hidden = true;
            document.getElementById("shopName").hidden = true;
        }
    }

</script>

</body>
</html>
