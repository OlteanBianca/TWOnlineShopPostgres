<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/components::header"><title></title></head>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #dddddd;
        }
    </style>

</head>
<body>
<div method="GET" class="container mt-4">

    <tr th:if="${commands == null || commands.isEmpty()}">
        <td colspan="2"> No Requests Available</td>
    </tr>

    <form method="get" th:object="${commands}" th:action="@{/ROLE_ADMIN_BB/commands}">
        <table>
            <tr>
                <th>Nr.</th>
                <th>Client</th>
                <th>Client Email</th>
                <th>Command</th>
                <th>Approve</th>
            </tr>

            <tr th:if="${commands != null && !commands.isEmpty()}">

                <span class="has-error" th:text="${error}"></span>

            <tr th:each="command, index : ${commands}">
                <td th:text="${index.index + 1}"></td>
                <td th:text="${command.getUser().username}"></td>
                <td th:text="${command.getUser().email}"></td>
                <td>
                    <div th:each="productCommand: ${command.getProducts()}">
                        <p th:text="${productCommand.getProduct().name} + '-' + ${productCommand.getQuantity()}"></p>
                    </div>
                </td>

                <td>
                    <form th:object="${authorizationToken}">
                        <div class="w3-row-padding">
                            <div class="text-center text-lg-start">
                                <a class="btn btn-primary btn-lg"
                                   style="padding-left: 2.5rem; padding-right: 2.5rem;"
                                   th:href="@{/ROLE_ADMIN_BB/commands/{id}(id=${command.id}, Authorization=${authorizationToken})}">
                                    Approve
                                </a>
                            </div>
                        </div>
                    </form>
                </td>
            </tr>

        </table>

        <form th:object="${authorizationToken}">
            <div class="text-center text-lg-start mt-4 pt-2">
                <a class="btn btn-primary btn-lg" style="padding-left: 2.5rem; padding-right: 2.5rem;"
                   th:href="@{/ROLE_ADMIN_BB(Authorization=${authorizationToken})}">
                    Cancel
                </a>
            </div>
        </form>
    </form>


</div>

<div th:include="fragments/components::bootstrap_script"></div>
</body>
</html>
